# The validating webhook of docs/operator.md §3.2 and §7. The API server reaches
# the operator's webhook server over this Service. The operator issues its own
# certificate on start and patches the caBundle below; apply the two files in
# either order, but a VirtualCluster or NodePool write before the first operator
# start fails closed, because failurePolicy is Fail.
apiVersion: v1
kind: Service
metadata:
  name: kubeyard-operator
  namespace: kubeyard-system
spec:
  selector:
    app.kubernetes.io/name: kubeyard-operator
  ports:
    - name: webhook
      port: 9443
      targetPort: 9443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubeyard-validating
webhooks:
  # sum(min) ≤ healthy nodes, min ≤ desired ≤ max, pinned nodes belong to the
  # pool and to one claim only, valuesOverride keeps off the node-binding paths,
  # and a VirtualCluster that still holds nodes is not deleted.
  - name: vc.kubeyard.wutz.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: kubeyard-operator
        namespace: kubeyard-system
        path: /validate-kubeyard-wutz-dev-v1alpha1-virtualcluster
        port: 9443
    rules:
      - apiGroups: [kubeyard.wutz.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [virtualclusters]
        scope: Cluster
  # The selector is not empty, takes no node from another pool, and keeps the
  # nodes that are leased to this pool.
  - name: nodepool.kubeyard.wutz.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: kubeyard-operator
        namespace: kubeyard-system
        path: /validate-kubeyard-wutz-dev-v1alpha1-nodepool
        port: 9443
    rules:
      - apiGroups: [kubeyard.wutz.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [nodepools]
        scope: Cluster
