# Permissions for the host-mode operator. Only what the reconciler in
# pkg/operator/host uses: node labels and taints, the three Kubeyard kinds and
# their status, and leader election. The operator.md §3 items for namespaces,
# eviction, and Flux objects come with the slices that need them.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeyard-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeyard-operator
  namespace: kubeyard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeyard-operator-host
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  - apiGroups: [kubeyard.wutz.dev]
    resources: [virtualclusters, nodepools, nodeleases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [kubeyard.wutz.dev]
    resources: [virtualclusters/status, nodepools/status, nodeleases/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeyard-operator-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeyard-operator-host
subjects:
  - kind: ServiceAccount
    name: kubeyard-operator
    namespace: kubeyard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeyard-operator-leader
  namespace: kubeyard-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeyard-operator-leader
  namespace: kubeyard-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeyard-operator-leader
subjects:
  - kind: ServiceAccount
    name: kubeyard-operator
    namespace: kubeyard-system
