# NodePool: a class of nodes that virtual clusters can claim (docs/operator.md §1).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.kubeyard.wutz.dev
spec:
  group: kubeyard.wutz.dev
  scope: Cluster
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    singular: nodepool
    shortNames: [np]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Total
          type: integer
          jsonPath: .status.total
        - name: Free
          type: integer
          jsonPath: .status.free
        - name: Reserved
          type: integer
          jsonPath: .status.reserved
        - name: Unhealthy
          type: integer
          jsonPath: .status.unhealthy
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodeSelector]
              properties:
                displayName:
                  type: string
                nodeSelector:
                  type: object
                  description: Candidate nodes, usually selected by NFD or GPU labels. An empty selector is rejected.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        required: [key, operator]
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                          values:
                            type: array
                            items:
                              type: string
                preemption:
                  type: object
                  properties:
                    policy:
                      type: string
                      enum: [Never, LowerPriority]
                    gracePeriod:
                      type: string
                      description: Notice given to the victim VC before its pods are evicted.
                    drainTimeout:
                      type: string
                      description: Time after which the drain is forced.
                release:
                  type: object
                  properties:
                    wipe:
                      type: string
                      enum: [none, reboot]
            status:
              type: object
              properties:
                total:
                  type: integer
                  minimum: 0
                free:
                  type: integer
                  minimum: 0
                reserved:
                  type: integer
                  minimum: 0
                unhealthy:
                  type: integer
                  minimum: 0
