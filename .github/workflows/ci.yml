name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # The GUI links a system webview through cgo, so every platform builds it.
    # Linux needs webkit2gtk-4.0, which webview_go requires and which ubuntu-22.04
    # still packages.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Starts the native window, checks that it serves the page, and saves a
      # screenshot of the desktop while it is open. The screenshot is uploaded so
      # the window contents can be inspected by hand.
      - name: GUI window launches (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -o kubeyard-gui ./gui
          xvfb-run -a .github/scripts/gui-smoke.sh ./kubeyard-gui "import -window root gui-linux.png"

      - name: GUI window launches (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          go build -o kubeyard-gui ./gui
          .github/scripts/gui-smoke.sh ./kubeyard-gui "screencapture -x gui-macos.png"

      - name: GUI window launches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o kubeyard-gui.exe ./gui
          $p = Start-Process -FilePath ./kubeyard-gui.exe -ArgumentList '-addr', '127.0.0.1:7791' -PassThru -RedirectStandardError gui.err
          $page = $null
          for ($i = 0; $i -lt 30 -and -not $page; $i++) {
            try { $page = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7791/).Content } catch { Start-Sleep -Seconds 1 }
          }
          if ($page -notmatch 'kubeyard-token') { exit 1 }
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Get-Content gui.err; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/gui-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id

      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-window-${{ matrix.os }}
          path: |
            gui-*.png
            gui.log
            gui.err
          if-no-files-found: ignore
