name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # The GUI is a Wails app, which links the system webview through cgo, so every
    # platform builds it. Linux needs webkit2gtk-4.0, which Wails v2 uses by default
    # and which ubuntu-22.04 still packages.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The overview the window shows, read through App.Overview from a fake API
      # server (cmd/fakeapiserver, not a cluster). The server must show its node
      # as Ready. The Windows step below runs the same test inline.
      - name: Overview against the fake cluster (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          KUBEYARD_LIVE_CONTEXT: fake
        run: |
          go build -o fake-apiserver ./cmd/fakeapiserver
          .github/scripts/with-fake-cluster.sh ./fake-apiserver go test -run TestLiveOverview -v ./gui

      # Starts the native window against the fake API server and saves a
      # screenshot of the desktop while the window is open. The binary needs the
      # production tag: without it, Wails exits at start-up.
      - name: GUI window launches (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -tags production -o kubeyard-gui ./gui
          go build -o fake-apiserver ./cmd/fakeapiserver
          xvfb-run -a .github/scripts/with-fake-cluster.sh ./fake-apiserver .github/scripts/gui-smoke.sh ./kubeyard-gui "import -window root gui-linux.png"

      # Plain go build leaves UniformTypeIdentifiers unlinked; wails build adds it.
      - name: GUI window launches (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: |
          go build -tags production -o kubeyard-gui ./gui
          go build -o fake-apiserver ./cmd/fakeapiserver
          .github/scripts/with-fake-cluster.sh ./fake-apiserver .github/scripts/gui-smoke.sh ./kubeyard-gui "screencapture -x gui-macos.png"

      # The Windows runners have no jq and no bash helper, so this step does the
      # same in PowerShell: start the fake server, point KUBECONFIG at it, run the
      # overview test, then start the window and capture the desktop.
      - name: GUI window launches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -tags production -o kubeyard-gui.exe ./gui
          go build -o fake-apiserver.exe ./cmd/fakeapiserver
          $fake = Start-Process -FilePath ./fake-apiserver.exe -ArgumentList '-addr', '127.0.0.1:7792' -PassThru -RedirectStandardError fake-apiserver.log
          $ready = $false
          for ($i = 0; $i -lt 30 -and -not $ready; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7792/api/v1/nodes | Out-Null; $ready = $true } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { Get-Content fake-apiserver.log; exit 1 }
          $kubeconfig = Join-Path $PWD 'fake-kubeconfig'
          Set-Content -Path $kubeconfig -Encoding utf8 -Value @'
          apiVersion: v1
          kind: Config
          clusters:
          - name: fake
            cluster:
              server: http://127.0.0.1:7792
          users:
          - name: fake
            user: {}
          contexts:
          - name: fake
            context:
              cluster: fake
              user: fake
          current-context: fake
          '@
          $env:KUBECONFIG = $kubeconfig
          $env:KUBEYARD_LIVE_CONTEXT = 'fake'
          go test -run TestLiveOverview -v ./gui
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath ./kubeyard-gui.exe -PassThru -RedirectStandardError gui.err
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Get-Content gui.err; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/gui-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id
          Stop-Process -Id $fake.Id

      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-window-${{ matrix.os }}
          path: |
            gui-*.png
            gui.log
            gui.err
            fake-apiserver.log
          if-no-files-found: ignore

  # The window against a live cluster: the overview must show the kind node, not
  # just the empty state. The screenshot is uploaded for inspection.
  gui-live-cluster:
    name: GUI with a live cluster (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick

      # Pin the cluster name: helm/kind-action defaults to chart-testing, and kind
      # names its kubeconfig context kind-<cluster name>, here kind-kubeyard.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubeyard
          wait: 120s

      - name: Check the overview and launch the window
        run: |
          KUBEYARD_LIVE_CONTEXT=kind-kubeyard go test -run TestLiveOverview -v ./gui
          go build -tags production -o kubeyard-gui ./gui
          xvfb-run -a .github/scripts/gui-smoke.sh ./kubeyard-gui "import -window root gui-kind.png"

      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-window-kind
          path: |
            gui-*.png
            gui.log
          if-no-files-found: ignore
