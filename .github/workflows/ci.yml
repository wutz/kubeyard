name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # The GUI is a Wails app, which links the system webview through cgo, so every
    # platform builds it. Linux needs webkit2gtk-4.0, which Wails v2 uses by default
    # and which ubuntu-22.04 still packages.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Starts the native window and saves a screenshot of the desktop while the
      # window is open. The binary needs the production tag: without it, Wails
      # exits at start-up. There is no cluster here, so the page shows the empty
      # state of the contexts list; the catalog runs in the gui-live-cluster job.
      - name: GUI window launches (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -tags production -o kubeyard-gui ./gui
          xvfb-run -a .github/scripts/gui-smoke.sh ./kubeyard-gui "import -window root gui-linux.png"

      # Plain go build leaves UniformTypeIdentifiers unlinked; wails build adds it.
      - name: GUI window launches (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: |
          go build -tags production -o kubeyard-gui ./gui
          .github/scripts/gui-smoke.sh ./kubeyard-gui "screencapture -x gui-macos.png"

      - name: GUI window launches (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -tags production -o kubeyard-gui.exe ./gui
          $p = Start-Process -FilePath ./kubeyard-gui.exe -PassThru -RedirectStandardError gui.err
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Get-Content gui.err; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/gui-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id

      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-window-${{ matrix.os }}
          path: |
            gui-*.png
            gui.log
            gui.err
          if-no-files-found: ignore

  # The catalog page against a live cluster: TestLiveCatalog reads the catalog of
  # the kind context, which has no Flux yet, so the view must explain that with a
  # note rather than an error. The window is then launched and captured.
  gui-live-cluster:
    name: GUI with a live cluster (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick

      # Pin the cluster name: helm/kind-action defaults to chart-testing, and kind
      # names its kubeconfig context kind-<cluster name>, here kind-kubeyard.
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubeyard
          wait: 120s

      - name: Check the catalog and launch the window
        run: |
          KUBEYARD_LIVE_CONTEXT=kind-kubeyard go test -run TestLiveCatalog -v ./gui
          go build -tags production -o kubeyard-gui ./gui
          xvfb-run -a .github/scripts/gui-smoke.sh ./kubeyard-gui "import -window root gui-kind.png"

      - name: Upload GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-window-kind
          path: |
            gui-*.png
            gui.log
          if-no-files-found: ignore
