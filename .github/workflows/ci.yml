name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # The GUI links a system webview through cgo, so every platform builds it.
    # Linux needs webkit2gtk-4.0, which webview_go requires and which ubuntu-22.04
    # still packages.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Starts the native window under a virtual display and checks that it
      # serves the page and stays up. It does not inspect what the window shows.
      - name: GUI window launches (Linux)
        if: runner.os == 'Linux'
        run: |
          go build -o kubeyard-gui ./gui
          xvfb-run -a ./kubeyard-gui -addr 127.0.0.1:7791 > gui.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7791/ -o page.html && break
            sleep 1
          done
          grep -q 'kubeyard-token' page.html
          sleep 5
          pgrep -f kubeyard-gui > /dev/null || { cat gui.log; exit 1; }
          pkill -f kubeyard-gui
